function hydrateProfileFromState(s){const me=s?.players?.find(p=>p.id===socket.id);if(!me)return;let changed=false;if(me.name&&me.name!==profile.name){profile.name=me.name;changed=true}if(me.avatar&&me.avatar!==profile.avatar){profile.avatar=me.avatar;changed=true}if(me.accent&&me.accent!==profile.accent){profile.accent=me.accent;changed=true}if(me.accent2&&me.accent2!==profile.accent2){profile.accent2=me.accent2;changed=true}if((me.bio??'')!==profile.bio){profile.bio=me.bio??profile.bio;changed=true}if(me.wallpaper&&me.wallpaper!==profile.wallpaper){profile.wallpaper=me.wallpaper;changed=true}if(me.glow&&me.glow!==profile.glow){profile.glow=me.glow;changed=true}if(me.density&&me.density!==profile.density){profile.density=me.density;changed=true}if(me.motion&&me.motion!==profile.motion){profile.motion=me.motion;changed=true}if(me.contrast&&me.contrast!==profile.contrast){profile.contrast=me.contrast;changed=true}if(changed){localStorage.setItem('gn_name',profile.name);localStorage.setItem('gn_avatar',profile.avatar);localStorage.setItem('gn_accent',profile.accent);localStorage.setItem('gn_accent2',profile.accent2||profile.accent);localStorage.setItem('gn_bio',profile.bio);localStorage.setItem('gn_wallpaper',profile.wallpaper);localStorage.setItem('gn_glow',profile.glow);localStorage.setItem('gn_density',profile.density);localStorage.setItem('gn_motion',profile.motion);localStorage.setItem('gn_contrast',profile.contrast);applyPrefs()}}

function navigate(id){if(current===id){renderView(id);return}document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id)?.classList.add('active');current=id;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));const title=([...(NAV||[]),['profileView','◉','Profile'],['lobbyView','◉','Private Room'],['gameView','◉','Game'],['resultView','◉','Round Complete'],['musicView','♫','Music'],['chatView','☵','Chat']].find(x=>x[0]===id)||['','',id])[2];$('pageTitle').textContent=title;renderView(id);window.scrollTo({top:0,behavior:'smooth'})}
function openMenu(){$('menuModal').classList.add('open')}function closeMenu(){$('menuModal').classList.remove('open')}
function renderView(id){if(id==='homeView')renderHome();if(id==='gamesView')renderGames();if(id==='dateNightView')renderDate();if(id==='musicView')renderMusic();if(id==='chatView')renderChatRoom();if(id==='statsView')renderStats();if(id==='loveView')renderLove();if(id==='streakView')renderStreak();if(id==='settingsView')renderSettings();if(id==='profileView')renderProfile();if(id==='lobbyView')renderLobby();if(id==='gameView')renderGame();if(id==='resultView')renderResult();if(id==='completeView')renderComplete();syncTop()}
function applyPrefs(){document.documentElement.style.setProperty('--accent',profile.accent);document.documentElement.style.setProperty('--accent2',profile.accent2||profile.accent);document.documentElement.style.setProperty('--glowBoost',profile.glow==='bright'?'1.28':profile.glow==='max'?'1.55':'1');document.body.dataset.density=profile.density;document.body.dataset.glow=profile.glow;document.body.dataset.motion=profile.motion;document.body.dataset.contrast=profile.contrast;const meta=document.querySelector('meta[name=theme-color]');if(meta)meta.content=profile.accent}function myPlayer(){return state?.players?.find(p=>p.id===socket.id)||null}function syncTop(){ applyPrefs(); $('topName').textContent=profile.name||'Player'; $('topAvatar').innerHTML=avatarHtml(profile.avatar); $('topAvatar').style.background=profile.accent }
function maybeRoomCta(){return state?.code?`<button class="btn primary" onclick="navigate('lobbyView')">Open private room</button>`:`<button class="btn primary" onclick="openRoomModal()">Start a private room</button>`}
function renderHome(){const p=state?.players||[];const partner=p.find(x=>x.id&&x.id!==socket.id);$('homeView').innerHTML=`<div class="hero"><div class="heroMain"><div class="eyebrow">Game Night 3.0.6 • Private • Two players</div><div class="heroTitle">Your shared space for games, music & little moments.</div><p class="heroCopy">Everything is built around one trusted connection: play together, talk while you play, switch to music, or just pick a date-night idea.</p><div class="heroActions">${maybeRoomCta()}<button class="btn ghost" onclick="navigate('dateNightView')">Pick a Date Night ✦</button></div></div><div class="heroSide"><div class="partnerStrip"><div class="avatars"><div class="avatar">${avatarHtml(profile.avatar)}</div>${partner?`<div class="avatar">${avatarHtml(partner.avatar)}</div>`:'<div class="avatar">＋</div>'}</div><div class="partnerMeta"><strong>${partner?esc(partner.name):'No connection yet'}</strong><span>${state?.code?`Room ${esc(state.code)}`:'Connect once, then keep the room remembered.'}</span><div class="onlineLine"><span class="statusDot"></span>${partner?'Both connected':'Waiting for your person'}</div></div></div><div class="miniStats"><div class="miniStat"><b>${state?.stats?.streak||0}</b><span>day streak</span></div><div class="miniStat"><b>${state?.stats?.bestStreak||0}</b><span>best streak</span></div><div class="miniStat"><b>${state?.stats?.games||0}</b><span>games together</span></div></div></div></div>
<div class="quick"><button onclick="navigate('gamesView')"><span class="ico">🎮</span><span class="lbl">Games</span></button><button onclick="navigate('chatView')"><span class="ico">💬</span><span class="lbl">Chat</span></button><button onclick="navigate('musicView')"><span class="ico">♫</span><span class="lbl">Music</span></button><button onclick="navigate('dateNightView')"><span class="ico">🌙</span><span class="lbl">Date Night</span></button><button onclick="navigate('profileView')"><span class="ico">◉</span><span class="lbl">Profile</span></button></div>
<div class="sectionHead"><h2>Tonight</h2><span>${partner?'Connected':'Private'}</span></div><div class="featureGrid"><button class="feature card" onclick="startCategory('Would You Rather')"><span class="featureIcon">❓</span><span class="arrow">›</span><h3>Play a round</h3><p>Jump into your last-used style with a clean, game-specific answer flow.</p></button><button class="feature card" onclick="randomDateNight()"><span class="featureIcon">✨</span><span class="arrow">›</span><h3>Surprise Date Night</h3><p>Pick something you can actually do together from separate devices.</p></button></div>
<div class="sectionHead"><h2>Games</h2><span>10 built in</span></div><div class="gameGrid">${gameCards().slice(0,5)}</div><div class="sectionHead"><h2>Connection</h2><span>${state?.code||'Not connected'}</span></div>${partner?`<div class="card pad"><div class="partnerStrip"><div class="avatars"><div class="avatar">${avatarHtml(profile.avatar)}</div><div class="avatar">${avatarHtml(partner.avatar)}</div></div><div class="partnerMeta"><strong>${esc(profile.name)} + ${esc(partner.name)}</strong><span>One private room • chat • games • music</span></div><button class="btn primary sm" onclick="navigate('lobbyView')">Play Together</button></div></div>`:`<div class="card pad"><div class="notice">Create a room, send the code once, and the app remembers the connection on this device.</div><div class="row" style="margin-top:10px"><button class="btn primary" onclick="openRoomModal()">Create / Join</button></div></div>`}` }
function gameCards(){return Object.entries(GAMES).map(([name,m])=>`<button class="gameCard card" onclick="startCategory('${name.replace(/'/g,"\\'")}')"><span class="gameArrow">›</span><span class="gameIcon">${m[0]}</span><span class="gameName">${esc(name)}</span><span class="gameDesc">${esc(m[2])}</span></button>`)}
function renderGames(){ $('gamesView').innerHTML=`<div class="sectionHead"><div><h2>Games</h2><span>10 games • no points • no winners</span></div><span>${state?.code?'Connected':'Private mode'}</span></div><div class="gameGrid">${gameCards().join('')}</div><div class="card pad" style="margin-top:12px"><div class="notice">Every game has its own interaction system. Your question bank stays intact; only the way the players answer and reveal has been rebuilt.</div></div>` }
function renderDate(){ $('dateNightView').innerHTML=`<div class="sectionHead"><div><h2>Date Night</h2><span>Choose something to do together</span></div><button class="btn primary sm" onclick="randomDateNight()">Surprise me</button></div><div class="dateGrid"><div class="card pad"><div class="eyebrow">Tonight's idea</div><h1 style="font-size:38px;letter-spacing:-.04em;margin-top:8px">${esc(state?.dateNight?.title||'Pick a vibe')}</h1><p style="color:var(--muted);line-height:1.55;margin-top:8px">${esc(state?.dateNight?.desc||'Tap surprise me and send the same idea to both players.')}</p><div class="chips"><span class="chip">Remote-friendly</span><span class="chip">2 players</span><span class="chip">No score</span></div><div class="row" style="margin-top:18px"><button class="btn primary" onclick="randomDateNight()">🎲 Randomize</button><button class="btn" onclick="navigate('chatView')">💬 Open chat</button></div></div><div class="stack">${DATE_CARDS.map(d=>`<button class="card pad" onclick="selectDate('${d.title.replace(/'/g,"\\'")}')" style="text-align:left"><div style="font-size:25px">${d.ico}</div><h3 style="margin-top:7px">${esc(d.title)}</h3><p style="color:var(--muted);font-size:12px;line-height:1.4;margin-top:3px">${esc(d.desc)}</p></button>`).join('')}</div></div>`}
const DATE_CARDS=[{title:'Cozy Movie Night',desc:'Pick a movie, grab snacks, and rate it together.',ico:'🎬'},{title:'Anime Night',desc:'Each person picks one episode. Then compare ratings.',ico:'🍿'},{title:'Music Swap',desc:'Take turns choosing songs and explain why you picked them.',ico:'🎵'},{title:'Question Roulette',desc:'Play random questions from your favorite categories.',ico:'🎲'},{title:'Compliment Challenge',desc:'Three genuine compliments each, no repeats.',ico:'💖'},{title:'Draw & Guess — Live',desc:'Take turns drawing and guessing.',ico:'🎨'},{title:'Memory Lane',desc:'Share favorite memories and funny moments.',ico:'🫶'},{title:'Two Truths & A Lie',desc:'Three statements each. Guess the lie.',ico:'🎭'},{title:'No-Plan Night',desc:'Flip a coin for every tiny decision.',ico:'🪩'}];
function randomDateNight(){if(state?.code)socket.emit('date_night');else{$('dateNightView')?.classList.add('active');toast('Create a room first to sync the idea.')}}function selectDate(title){const d=DATE_CARDS.find(x=>x.title===title);if(state?.code){state.dateNight=d;renderDate();socket.emit('chat','Date Night idea: '+title)}else{toast(title)}}
function renderMusic(){ $('musicView').innerHTML=`<div class="sectionHead"><div><h2>Music Room</h2><span>Shared YouTube player</span></div><span>${state?.musicPlaying?'Playing':'Paused'}</span></div><div class="musicGrid"><div class="card musicPlayer"><div class="album">♫</div><div><div class="eyebrow">Shared player</div><h2 style="margin-top:7px">Music for the room</h2><p style="color:var(--muted);font-size:12px;line-height:1.5;margin-top:5px">Load a legitimate YouTube video. Play, pause and position changes are sent to both players.</p><div class="row" style="margin-top:12px"><input class="input" id="musicInput" placeholder="Paste YouTube link" value="${esc(state?.musicUrl?'https://www.youtube.com/watch?v='+state.musicUrl:'')}"><button class="btn primary" onclick="loadMusic()">Load</button></div><div class="row" style="margin-top:8px"><button class="btn" onclick="musicCommand('play')">▶ Play</button><button class="btn" onclick="musicCommand('pause')">Ⅱ Pause</button><button class="btn" onclick="navigate('chatView')">💬 Chat</button></div></div></div><div class="card pad"><div class="eyebrow">Player</div><div id="musicEmbed" class="ytFrame"><div class="notice" style="margin:14px">Load a video to start the shared player.</div></div><div style="margin-top:12px" class="notice">Spotify Premium is not required for this mode.</div></div></div>`;syncYouTube()}
function loadMusic(){const v=$('musicInput').value.trim();if(!v)return;socket.emit('music_load',v)}
function musicCommand(type){if(!state?.musicUrl)return toast('Load a YouTube link first');socket.emit('music_command',{type})}
function syncYouTube(){if(!state?.musicUrl)return;const box=$('musicEmbed');if(!box)return;box.innerHTML=`<div id="ytPlayer"></div>`;if(window.YT?.Player)createYT();else{window.onYouTubeIframeAPIReady=()=>createYT();if(!document.getElementById('ytapi')){const s=document.createElement('script');s.id='ytapi';s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)}}}
function createYT(){yt=new YT.Player('ytPlayer',{height:'250',width:'100%',videoId:state.musicUrl,playerVars:{playsinline:1,controls:1,rel:0},events:{onReady:e=>{if(expectedMusic?.position!=null)e.target.seekTo(expectedMusic.position,true);if(expectedMusic?.type==='play'||state?.musicPlaying)e.target.playVideo()},onStateChange:e=>{if(e.data===1&&!musicSyncTimer)musicSyncTimer=setInterval(()=>{try{if(yt&&state?.musicPlaying&&state?.musicOwnerId===myPlayer()?.playerId)socket.emit('music_command',{type:'seek',position:yt.getCurrentTime()})}catch{}},3500);if(e.data!==1&&musicSyncTimer){clearInterval(musicSyncTimer);musicSyncTimer=null}}}})}
function formatTime(ts){try{return new Date(ts||Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}catch{return ''}}
function toggleEmojiTray(id){const el=$(id);if(el)el.classList.toggle('hidden')}

function chatComposerHtml(id,placeholder,sendFn){const emoji=['😂','😭','🥹','😳','😅','😂','🤨','😎','🫶','❤️','✨','🔥'];return `<div class="emojiTray hidden" id="${id}Emoji">${emoji.map(e=>`<button type="button" onclick="insertEmoji('${id}','${e}')">${e}</button>`).join('')}</div><div class="chatMeta"><span>Enter to send • Shift+Enter for a new line</span><span id="${id}Count">0/800</span></div><div class="chatComposer"><div class="chatComposerBox"><button class="chatTool" type="button" onclick="toggleEmojiTray('${id}Emoji')" aria-label="Emoji">☺</button><textarea id="${id}" rows="1" maxlength="800" placeholder="${placeholder}" oninput="emitTyping(this.value.length>0);autoGrow(this);$('${id}Count').textContent=this.value.length+'/800'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();${sendFn}()}"></textarea></div><button class="sendRound" type="button" onclick="${sendFn}()" aria-label="Send">➤</button></div>`}
function renderChatRoom(){const partner=state?.players?.find(p=>p.id!==socket.id);$('chatView').innerHTML=`<div class="card chatRoom"><div class="chatHead"><div><strong>Chat Room</strong><div style="font-size:10px;color:var(--muted)">${partner?esc(partner.name):'Waiting for connection'} ${partner?`• ${partner.online?'Online':'Reconnecting'}`:''}</div></div><button class="btn sm" onclick="navigate('profileView')">◉ Profile</button></div><div class="messages" id="chatMessages"></div><div class="typing" id="typingLine"></div>${chatComposerHtml('chatInput','Message…','sendChat')}</div>`;if(window.chatHistory){const box=$('chatMessages');if(box){[...window.chatHistory].forEach(m=>box.appendChild(makeMsgEl(m)));box.scrollTop=box.scrollHeight}}}

function sendChat(){if(!socketReady)return toast('Connecting to Game Night…');const el=$('chatInput');const v=el?.value.trim();if(!v)return;socket.emit('chat',v,(ok,msg)=>{if(ok===false){toast(msg||'Message could not be sent');return}if(msg)addChatMessage(msg)});el.value='';el.style.height='auto';if($('chatInputCount'))$('chatInputCount').textContent='0/800';emitTyping(false);const tray=$('chatInputEmoji');tray?.classList.add('hidden')}
function emitTyping(v){if(socketReady)socket.emit('typing',!!v)}
function makeMsgEl(m){const div=document.createElement('div');if(m.system){div.className='msg';div.innerHTML=`<div class="bubble" style="margin:auto;color:var(--muted)">${esc(m.text)}<span class="msgTime">${formatTime(m.time)}</span></div>`}else{const mine=m.id?.startsWith(socket.id);div.className='msg '+(mine?'me':'');div.innerHTML=`<div class="msgAvatar">${avatarHtml(m.avatar)}</div><div><div class="bubble">${esc(m.text)}<small>${esc(m.name||'Player')}</small><span class="msgTime">${formatTime(m.time)}</span></div><div class="msgTools"><button type="button" onclick="quickReact('${encodeURIComponent(m.text)}','❤️')">❤️</button><button type="button" onclick="quickReact('${encodeURIComponent(m.text)}','😂')">😂</button></div></div>`}return div}

function applySegment(seg,c){if(!c||!seg?.from||!seg?.to)return;const d=devicePixelRatio||1;const x=c.getContext('2d');x.save();x.setTransform(d,0,0,d,0,0);x.lineWidth=Number(seg.width)||6;x.lineCap='round';x.lineJoin='round';x.globalCompositeOperation=seg.tool==='eraser'?'destination-out':'source-over';x.strokeStyle=seg.color||'#72a7ff';x.beginPath();x.moveTo(seg.from[0]*c.clientWidth,seg.from[1]*c.clientHeight);x.lineTo(seg.to[0]*c.clientWidth,seg.to[1]*c.clientHeight);x.stroke();x.restore()}

function setupCanvas(active){const c=$('drawCanvas');if(!c)return;const d=devicePixelRatio||1;c.width=Math.max(1,Math.round(c.clientWidth*d));c.height=Math.max(1,Math.round(c.clientHeight*d));const serverStrokes=Array.isArray(state?.drawStrokes)?state.drawStrokes:[];if(drawHistory.length && (!serverStrokes.length || serverStrokes.length<drawHistory.length))drawHistory=drawHistory.map(x=>({...x}));else drawHistory=serverStrokes.map(x=>({...x}));drawRedo=[];replayDraw(drawHistory);if(!active)return;setDrawTool(drawTool);setDrawSize(drawSize);const pos=e=>{const r=c.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]};const start=e=>{if(e.button!==undefined&&e.button!==0)return;drawing=true;drawRedo=[];currentStrokeId=crypto.randomUUID();lastPt=pos(e);c.setPointerCapture?.(e.pointerId);e.preventDefault()};const move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);const seg={strokeId:currentStrokeId,from:lastPt,to:p,color:drawTool==='eraser'?'#ffffff':drawColor,width:drawSize,tool:drawTool};drawHistory.push(seg);applySegment(seg,c);socket.emit('draw_stroke',seg);lastPt=p};const end=e=>{if(!drawing)return;drawing=false;try{c.releasePointerCapture?.(e.pointerId)}catch{};lastPt=null};c.onpointerdown=start;c.onpointermove=move;c.onpointerup=end;c.onpointercancel=end;c.onpointerleave=end}
function resizeDrawCanvas(){const c=$('drawCanvas');if(!c)return;const d=devicePixelRatio||1;c.width=Math.max(1,Math.round(c.clientWidth*d));c.height=Math.max(1,Math.round(c.clientHeight*d));replayDraw(drawHistory)}
function setDrawTool(tool){drawTool=tool;document.querySelectorAll('.toolBtn').forEach(x=>x.id==='toolPen'||x.id==='toolEraser'?x.classList.toggle('active',x.id.toLowerCase().includes(tool)):null);const s=$('drawToolStatus');if(s)s.textContent=tool==='eraser'?'Eraser':'Pen';$('canvasSurface')?.classList.toggle('eraser',tool==='eraser')}
function setDrawColor(color){drawColor=color||profile.accent;drawTool='pen';setDrawTool('pen');document.querySelectorAll('.colorPick').forEach(x=>x.classList.toggle('active',x.style.backgroundColor===color||x.style.background===color));const c=$('drawCustomColor');if(c)c.value=drawColor}
function setDrawSize(v){drawSize=Math.max(2,Math.min(28,Number(v)||6));const el=$('drawSize');if(el)el.value=drawSize;const lab=$('drawSizeValue');if(lab)lab.textContent=drawSize}
function clearLocalCanvas(){const c=$('drawCanvas');if(c){const d=devicePixelRatio||1;const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height)}}
function clearCanvas(){if(!state||state.actorId!==myPlayer()?.playerId)return;drawHistory=[];drawRedo=[];clearLocalCanvas();socket.emit('draw_clear')}
function undoDraw(){if(!state||state.actorId!==myPlayer()?.playerId)return;socket.emit('draw_undo')}
function redoDraw(){if(!state||state.actorId!==myPlayer()?.playerId)return;socket.emit('draw_redo')}
function finishDrawing(){submitTurn({type:'draw_done',value:'done'})}
function renderComplete(){const s=state?.stats||{};$('completeView').innerHTML=`<div class="card pad" style="text-align:center;min-height:430px;display:grid;place-items:center"><div><div style="font-size:72px">✨</div><div class="eyebrow">Game Night complete</div><h1 style="font-size:44px;letter-spacing:-.05em;margin-top:6px">That was a good night.</h1><p style="color:var(--muted);max-width:520px;margin:10px auto;line-height:1.55">Your shared streak and together-stats have been updated. Pick another game, open chat, or start a fresh night.</p><div class="miniStats" style="max-width:540px;margin:18px auto"><div class="miniStat"><b>${s.streak||0}</b><span>day streak</span></div><div class="miniStat"><b>${s.games||0}</b><span>games together</span></div><div class="miniStat"><b>${s.nights||0}</b><span>date nights</span></div></div><div class="row" style="margin-top:16px"><button class="btn primary" onclick="navigate('gamesView')">Play another</button><button class="btn" onclick="navigate('chatView')">Chat</button><button class="btn" onclick="socket.emit('rematch',(ok,msg)=>{if(!ok)toast(msg||'Only the host can rematch the room')})">Rematch</button></div></div></div>`}
function renderResult(){const r=gameResult||{};const a=r.answers||{};const cat=state?.category||'';let detail='Round complete. Talk, react, and keep going.';if(r.actorAnswer||r.prediction)detail=`Answer: ${esc(r.actorAnswer||a[state?.actorId]||'—')}<br>Prediction: ${esc(r.prediction||a[state?.predictorId]||'—')}`;if(cat==='Truth or Dare')detail=`${esc(r.choice||'Turn')} completed: ${esc(r.response||'Done')}`;if(cat==='Two Truths & A Lie'&&r.statements){try{const arr=JSON.parse(r.statements);detail=arr.map((x,i)=>`<div>${i+1}. ${esc(x)} ${i===Number(r.lieIndex)?'• Lie':''}</div>`).join('')+`<div style="margin-top:8px">Partner picked ${Number(r.pick)+1}.</div>`}catch{}}if(cat==='Guess The Vibe')detail=`Actual vibe: ${esc(r.actual||'—')} • Prediction: ${esc(r.prediction||'—')}`;if(cat==='Card Flip')detail=`Card picked: ${esc(r.card||'—')}`;if(cat==='Draw & Guess — Live')detail=`Drawing round finished. Partner's guess: ${esc(r.guess||'—')}`;$('resultView').innerHTML=`<div class="card pad"><div class="eyebrow">Round ${state?.round||0} complete</div><h1 style="font-size:42px;letter-spacing:-.05em;margin-top:5px">Nice. No leaderboard needed.</h1><div class="resultBox" style="margin-top:16px"><h3>${esc(cat)}</h3><p>${detail}</p></div><div class="resultActions"><button class="btn primary" onclick="socket.emit('next_round')">${(state?.round||0)>=((state?.totalRounds)||5)?'Finish night':'Next round'}</button><button class="btn danger" onclick="endGameNow()">⏹ End game</button><button class="btn" onclick="navigate('chatView')">Chat</button><button class="btn" onclick="navigate('gamesView')">Choose another game</button></div></div>`}
function openRoomModal(){const m=document.createElement('div');m.className='modal open';m.id='roomModalTemp';m.innerHTML=`<div class="modalBox card"><div class="modalHead"><h2>Private connection</h2><button class="btn sm" onclick="this.closest('.modal').remove()">✕</button></div><div class="stack"><button class="btn primary" onclick="createRoom();document.getElementById('roomModalTemp')?.remove()">Create a new room</button><div class="row"><input class="input" id="joinInput" placeholder="Room code" maxlength="6"><button class="btn" onclick="joinRoom();document.getElementById('roomModalTemp')?.remove()">Join</button></div><div class="notice">You only need the room code once. Your session is remembered locally for reconnects.</div></div></div>`;document.body.appendChild(m)}
function createRoom(){if(!socketReady)return toast('Connecting to Game Night…');const m=$('roomModalTemp');socket.emit('create_room',{name:profile.name,avatar:profile.avatar,accent:profile.accent,accent2:profile.accent2,bio:profile.bio,wallpaper:profile.wallpaper,glow:profile.glow,density:profile.density,motion:profile.motion,contrast:profile.contrast,session,accountId:localStorage.getItem('gn_account_id')||''},(ok,msg)=>{if(!ok)return toast(msg||'Could not create the private room');m?.remove()})}function joinRoom(){if(!socketReady)return toast('Connecting to Game Night…');const c=$('joinInput')?.value.trim().toUpperCase();if(!c)return toast('Enter the room code');const m=$('roomModalTemp');socket.emit('join_room',{code:c,name:profile.name,avatar:profile.avatar,accent:profile.accent,accent2:profile.accent2,bio:profile.bio,wallpaper:profile.wallpaper,glow:profile.glow,density:profile.density,motion:profile.motion,contrast:profile.contrast,session,accountId:localStorage.getItem('gn_account_id')||''},(ok,msg)=>{if(!ok)return toast(msg||'Could not join that room');m?.remove()})}function copyCode(){if(!state?.code)return;navigator.clipboard?.writeText(state.code);toast('Room code copied')}
function googleSignIn(){if(!window.google?.accounts?.id)return toast('Google sign-in is unavailable until the deployment is configured.');window.google.accounts.id.prompt()}
function logoutLocal(){try{socket.disconnect()}catch{}localStorage.removeItem('gn_account_id');localStorage.removeItem('gn_google');localStorage.removeItem('gn_session');toast('Logged out on this device');setTimeout(()=>location.reload(),450)}
async function initGoogle(){try{const r=await fetch('/api/config');const c=await r.json();if(c.googleClientId&&window.google){window.google.accounts.id.initialize({client_id:c.googleClientId,callback:cred=>fetch('/api/auth/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:cred.credential})}).then(x=>x.json()).then(j=>{if(j.account){localStorage.setItem('gn_account_id',j.account.id);localStorage.setItem('gn_google',JSON.stringify(j.account));profile.name=j.account.name||profile.name;if(!profile.avatar || profile.avatar==='🌙')profile.avatar=j.account.picture||profile.avatar;saveLocalProfile();toast('Google account connected')}})});}}catch{}}
window.addEventListener('resize',()=>{clearTimeout(window.__drawResizeTimer);window.__drawResizeTimer=setTimeout(()=>resizeDrawCanvas(),120)});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
async function retryGoogle(){try{await initGoogle()}catch{}}
setTimeout(retryGoogle,1400);
socket.on('connect',()=>{socketReady=true; if($('connState'))$('connState').textContent='Connected'; socket.emit('resume_session',session)});socket.on('disconnect',()=>{socketReady=false; if($('connState'))$('connState').textContent='Reconnecting…'});socket.on('connect_error',()=>{socketReady=false; if($('connState'))$('connState').textContent='Connection unavailable';});socket.on('session_ready',s=>{session=s;localStorage.setItem('gn_session',s);renderHome();if(localStorage.getItem('gn_pending_game')){const cat=localStorage.getItem('gn_pending_game');localStorage.removeItem('gn_pending_game');setTimeout(()=>{navigate('lobbyView');const me=state?.players?.find(x=>x.id===socket.id);if(me?.host){socket.emit('set_category',cat,(ok)=>{if(ok)socket.emit('start_game',{},(ok2,msg)=>{if(!ok2)toast(msg||'Could not start the game')})})}},120)}});socket.on('state',s=>{state=s;hydrateProfileFromState(s);if(Array.isArray(s.chat)){window.chatHistory=s.chat.slice(-200)}if(current==='homeView'||current==='gamesView'||current==='dateNightView'||current==='lobbyView'||current==='statsView'||current==='streakView')renderView(current);const target=s.phase==='game'?'gameView':s.phase==='results'?'resultView':s.phase==='complete'?'completeView':null;if(target&&current!==target)navigate(target);else if(target&&current===target)renderView(target);});socket.on('night_complete',x=>{state=x.state;renderComplete();navigate('completeView')});socket.on('resume_ok',s=>{state=s;hydrateProfileFromState(s);renderView(current);});socket.on('resume_failed',()=>{});socket.on('error_message',m=>toast(m));socket.on('chat',m=>{addChatMessage(m)});socket.on('typing',name=>{if($('typingLine'))$('typingLine').textContent=name?name+' is typing…':'';if($('gameTyping'))$('gameTyping').textContent=name?name+' is typing…':''});socket.on('round_started',x=>{state=x.state;localRoundDone=false;gameResult=null;drawHistory=[];drawRedo=[];navigate('gameView')});socket.on('game_ended',x=>{state=x.state;gameResult=null;localRoundDone=false;navigate('lobbyView');toast('Game ended — back in the private room')});socket.on('round_results',x=>{state=x.state;gameResult=x;navigate('resultView')});socket.on('draw_stroke',d=>{if(!Array.isArray(drawHistory))drawHistory=[];drawHistory.push(d);applySegment(d,$('drawCanvas'))});socket.on('draw_clear',()=>{drawHistory=[];drawRedo=[];clearLocalCanvas()});socket.on('draw_sync',x=>{drawHistory=Array.isArray(x?.strokes)?x.strokes:[];drawRedo=[];replayDraw(drawHistory)});socket.on('date_night_pick',d=>{state.dateNight=d;navigate('dateNightView');toast('Date Night synced')});socket.on('music_sync',m=>{expectedMusic=m;if(m.type==='load'){state.musicUrl=m.id;state.musicPlaying=false;state.musicOwnerId=m.ownerId||state.musicOwnerId;renderMusic()}else if(yt){if(m.type==='play')yt.playVideo();if(m.type==='pause')yt.pauseVideo();if(m.type==='seek')yt.seekTo(m.position,true)}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!window.matchMedia('(display-mode: standalone)').matches&&!window.navigator.standalone){$('installBanner').style.display='flex';}});async function installPwa(){if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone)return toast('Game Night is already installed');if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch{}deferredPrompt=null;$('installBanner').style.display='none';return}showInstallOptions()}function showInstallOptions(){if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone)return toast('Game Night is already installed');const m=document.createElement('div');m.className='modal open';m.id='installModal';m.innerHTML=`<div class="modalBox card"><div class="modalHead"><h2>Install Game Night</h2><button class="btn sm" onclick="this.closest('.modal').remove()">✕</button></div><div class="stack"><div class="notice"><b>Android / Chrome:</b> use the <b>Install app</b> button when it appears. If it does not, open the browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>.</div><div class="notice"><b>iPhone / iPad:</b> open this site in Safari, tap <b>Share</b>, then <b>Add to Home Screen</b>.</div><div class="notice"><b>Desktop Chrome / Edge:</b> use the install icon in the address bar, or the browser menu's <b>Install</b> option.</div><button class="btn primary" onclick="installPwa();this.closest('.modal').remove()">Try in-app install</button></div></div>`;document.body.appendChild(m)}window.addEventListener('appinstalled',()=>{$('installBanner').style.display='none';toast('Game Night installed')});
